<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="gt gd">
  <title id="gt">Go — BoardDuel</title>
  <desc id="gd">Square indigo icon with a warm wooden Go board centred inside; a nine by nine grid is etched on the board, three stones sit at the empty-corner opening (star points), and a soft amber halo around the black stone marks the last move.</desc>
  <rect width="512" height="512" fill="#312E81"/>
  <!-- 木色棋盘（居中） -->
  <rect x="66" y="66" width="380" height="380" rx="18" fill="#9C7B4A"/>
  <rect x="76" y="76" width="360" height="360" rx="12" fill="#DBA859"/>
  <!-- 9×9 网格线（每格 40px，留 20px 边距） -->
  <g stroke="#3D2C18" stroke-opacity=".55" stroke-width="2" fill="none">
    <path d="M96 96h320M96 136h320M96 176h320M96 216h320M96 256h320M96 296h320M96 336h320M96 376h320M96 96v280M136 96v280M176 96v280M216 96v280M256 96v280M296 96v280M336 96v280M376 96v280M416 96v280"/>
  </g>
  <!-- 9 个星位（传统点位：4 角 + 4 边 + 1 天元） -->
  <g fill="#3D2C18" fill-opacity=".75">
    <circle cx="136" cy="136" r="4"/>
    <circle cx="376" cy="136" r="4"/>
    <circle cx="136" cy="376" r="4"/>
    <circle cx="376" cy="376" r="4"/>
    <circle cx="256" cy="136" r="4"/>
    <circle cx="256" cy="376" r="4"/>
    <circle cx="136" cy="256" r="4"/>
    <circle cx="376" cy="256" r="4"/>
    <circle cx="256" cy="256" r="4"/>
  </g>
  <!-- 3 颗开局棋子（角力 + 一颗带最后手高亮） -->
  <circle cx="176" cy="216" r="22" fill="#1B212A"/>
  <circle cx="336" cy="296" r="22" fill="#F4F6F2"/>
  <!-- 最后手：黑棋外围高亮圈 -->
  <circle cx="176" cy="216" r="29" fill="none" stroke="#F59E0B" stroke-width="4" fill-opacity="0"/>
</svg>
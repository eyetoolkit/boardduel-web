<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n-title="title.auto.hc_皮肤商店BoardDuel_37801">Skin Shop · Board Duel</title>
  <meta name="description" data-i18n="shop.meta_desc" content="Skin Shop - Board Duel board game battle site, exchange coins for avatars and emojis.">
  <link rel="canonical" href="https://boardduel.com/shop/">
  
  
  <link rel="alternate" hreflang="zh-CN" href="https://boardduel.com/shop/" />
  <link rel="alternate" hreflang="en" href="https://boardduel.com/shop/?lang=en" />
  <link rel="alternate" hreflang="ja" href="https://boardduel.com/shop/?lang=ja" />
  <link rel="alternate" hreflang="es" href="https://boardduel.com/shop/?lang=es" />
  <link rel="alternate" hreflang="fr" href="https://boardduel.com/shop/?lang=fr" />
  <link rel="alternate" hreflang="de" href="https://boardduel.com/shop/?lang=de" />
  <link rel="alternate" hreflang="x-default" href="https://boardduel.com/shop/" />
<style>
    :root{ --p:#4f46e5; --p-d:#4338ca; --p-l:#eef2ff; --g:#22b573; --g-l:#e7f9f0; --bg:#faf9ff; --card:#fff; --t:#1e1b4b; --m:#6b7280; --line:rgba(23,24,40,0.08); }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);line-height:1.6}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
    nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
    .nav-in{display:flex;align-items:center;gap:18px;height:60px}
    .nav-in .brand{font-weight:800;font-size:18px}
    .nav-in .brand span{color:var(--p)}
    .nav-in .links{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
    .nav-in .links a{color:var(--m);font-size:14px;padding:8px 12px;border-radius:999px;transition:.15s}
    .nav-in .links a:hover,.nav-in .links a.active{color:var(--p);background:var(--p-l)}
    .container{padding:36px 0 48px}
    .container h1{font-size:1.7rem;margin-bottom:.5rem;color:var(--p-d)}
    .sub{color:var(--m);margin-bottom:1.5rem}
    .balance-bar{background:linear-gradient(135deg,var(--p-l),var(--g-l));border-radius:14px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px}
    .balance-bar .coin{font-size:2rem}
    .balance-bar .txt{font-weight:800;font-size:1.3rem;color:var(--p-d)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
    .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;transition:.2s;position:relative}
    .item:hover{border-color:var(--p);transform:translateY(-2px)}
    .item .icon{font-size:2.6rem}
    .item .name{font-weight:700;margin-top:8px}
    .item .cost{color:var(--m);font-size:.85rem;margin-top:4px}
    .item .cost b{color:var(--p)}
    .item .status{font-size:.75rem;margin-top:6px;padding:3px 8px;border-radius:999px;display:inline-block}
    .item .status.owned{background:var(--g-l);color:var(--g)}
    .item .status.active{background:var(--p-l);color:var(--p-d)}
    .item .status.use{background:var(--p-l);color:var(--p-d)}
    .item.owned-off{opacity:.85}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;opacity:0;transition:.3s;z-index:99}
    .toast.show{opacity:1}
    footer{margin-top:40px;border-top:1px solid var(--line);background:var(--card);padding:24px 0;text-align:center;color:var(--m);font-size:.8rem}
    @media(max-width:640px){.nav-in .links{display:none}}
  </style>
  <link rel="stylesheet" href="/css/shared/tokens.css?v=p4fix2">
  <link rel="stylesheet" href="/css/shared/brand-ds2.css?v=ds2-22">
<script src="/i18n/i18n.js?v=33"></script>
  <link rel="manifest" href="/manifest.zh.webmanifest">
</head>
<body>

<div id="site-header" style="min-height:65px"
     data-brand-a="Board" data-brand-b="Duel" data-mark="duel-chess"
     data-nav='[{"label":"Home","href":"/","i18n":"nav.home"}]'
     data-cta-label="Home" data-cta-href="/" data-cta-i18n="nav.home"></div>

  <nav><div class="wrap nav-in">
    <div class="brand">♟️ Board<span>Duel</span></div>
    <div class="links"><a href="/" data-i18n="shop.nav_home">Home</a><a href="/rank/" data-i18n="shop.nav_rank">Ranking</a><a href="/shop/" class="active" data-i18n="shop.nav_shop">Shop</a><a href="/about/" data-i18n="shop.nav_about">About</a></div>
  </div></nav>

  <div class="container"><div class="wrap">
    <h1 data-i18n="shop.h1">🛒 Skin Shop</h1>
    <p class="sub" data-i18n="shop.subtitle">Exchange coins for avatars and emojis. Win a game +10 coins.</p>
    <div class="balance-bar"><span class="coin">🪙</span><span class="txt" id="balance">—</span></div>
    <div class="grid" id="catalog"><div style="color:var(--m);grid-column:1/-1;text-align:center;padding:20px;" data-i18n="shop.loading">Loading...</div></div>
  </div></div>

  <footer class="sites-footer">
      <div class="wrap">
        <div class="sf-title" data-i18n="home.site_network">🎯 Our Brand Network</div>
        <div class="sf-matrix">
          <a href="https://mathduel.games/" class="sf-item">
            <svg class="duel-icon sf-emoji" aria-hidden="true"><use href="/shared/icons.svg#duel-calculator"></use></svg>
            <span data-i18n="bd_shop_1">MathDuel</span>
          </a>
          <a href="https://boardduel.com/" class="sf-item">
            <svg class="duel-icon sf-emoji" aria-hidden="true"><use href="/shared/icons.svg#duel-chess"></use></svg>
            <span data-i18n="bd_shop_2">BoardDuel</span>
          </a>
          <a href="https://memoryduel.com/" class="sf-item">
            <svg class="duel-icon sf-emoji" aria-hidden="true"><use href="/shared/icons.svg#duel-brain"></use></svg>
            <span data-i18n="bd_shop_3">MemoryDuel</span>
          </a>
        </div>
        <div class="sf-links">
          <a href="/about/" data-i18n="nav.about">About</a>
          <a href="/privacy/" data-i18n="nav.privacy">Privacy</a>
          <a href="/terms/" data-i18n="nav.terms">Terms</a>
          <a href="/contact/" data-i18n="nav.contact">Contact</a>
        </div>
        <div class="sf-copy" data-i18n="home.footer">© 2026 BoardDuel · Free to play · Privacy-first</div>
      </div>
      <div class="sf-note">© 2026 Board Duel</div>
    </footer>
  <div class="toast" id="toast"></div>

  <script>
  var api = function(path, opts){ return fetch(path, Object.assign({ credentials:'include' }, opts)).then(function(r){ return r.ok ? r.json() : Promise.reject(new Error('HTTP '+r.status)); }); };
  var toast = function(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); },2500); };
  var CATALOG = [];
  var owned = [], active = { avatar:null, emoji:null };

  function render() {
    var grid = document.getElementById('catalog');
    grid.innerHTML = '';
    CATALOG.forEach(function(it){
      var isOwned = owned.indexOf(it.id) >= 0;
      var isActive = active[it.kind] === it.id;
      var card = document.createElement('div');
      card.className = 'item' + (isOwned ? ' owned-off' : '');
      card.innerHTML =
        '<div class="icon">'+it.icon+'</div><div class="name">'+it.name+'</div>'+
        '<div class="cost">🪙 <b>'+it.cost+'</b></div>'+
        (isActive ? '<div class="status active" data-i18n="shop.in_use">In Use</div>' :
         isOwned ? '<div class="status use" data-i18n="shop.use">Use</div>' :
         '<div class="status" data-i18n="shop.buy">Buy</div>');
      card.onclick = function(){ isOwned ? useItem(it) : buyItem(it); };
      grid.appendChild(card);
    });
  }
  function buyItem(it) {
    api('/api/shop/purchase', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ item: it.id }) })
      .then(function(w){
        owned = w.owned; active = w.active;
        document.getElementById('balance').textContent = '余额 ' + w.balance;
        render(); toast('已购买 ' + it.name);
      }).catch(function(e){ toast(e.message || '购买失败'); });
  }
  function useItem(it) {
    api('/api/wallet/active', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ kind: it.kind, id: it.id }) })
      .then(function(w){
        active = w.active; render(); toast('已使用 ' + it.name);
      }).catch(function(e){ toast(e.message || '设置失败'); });
  }
  function init() {
    api('/api/shop/catalog').then(function(d){
      CATALOG = d.catalog || []; owned = d.owned || []; active = d.active || {};
      document.getElementById('balance').textContent = '余额 ' + d.balance;
      render();
    }).catch(function(){ document.getElementById('catalog').innerHTML = '<div style="color:var(--m);grid-column:1/-1;text-align:center;padding:20px;" data-i18n="shop.unavailable">Shop temporarily unavailable (please ensure account is initialized)</div>'; });
  }
  document.addEventListener('DOMContentLoaded', init);
  </script>
  <script src="/shared/site-header.js?v=ds2-11"></script>
  <script src="/shared/sso-bridge.js?v=1" defer></script>
</body>
</html>

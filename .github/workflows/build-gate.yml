# 构建门禁（Phase 2.3，2026-10-06）
#
# 本仓库此前**完全没有 CI** —— tsc 与 vite build 只在我本机跑过，
# 类型错误、构建失败可以直接推到 main 并自动上 Pages。
# 后端 tri-sites 从建库起 CI 红了 120 次，本仓库连门禁都没有；
# 两者一起说明「绿灯」在这里从来没有被真正验证过。
#
# 本 workflow 只做一件事：`pnpm build`。四个仓库的 build 脚本都是
#   tsc --noEmit && vite build && <copy-legacy / filter-sitemap>
# 所以这一条命令就同时覆盖了类型检查与生产构建，不需要额外的 typecheck 步骤。
#
# 注意：本 workflow 不部署 —— Pages 由 push main 自动部署。
# 它的价值是**在部署之前**把类型/构建错误挡住，避免坏包上线路。

name: build-gate

on:
  # 手动触发兜底：2026-10-21 发现经 GitHub Git Data API 推送的 commit 不触发
  # Actions（git push 正常触发），网络只通 API 时用它手动跑门禁。
  workflow_dispatch:
  push:
    branches: [main]
    paths:
# legacy/ 也会被 copy-legacy.mjs 拷进产物，改动同样需要门禁覆盖。
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'index.html'
      - 'games/**'
      - 'how-to-play/**'
      - 'rank/**'
      - 'shop/**'
      - 'stats/**'
      - 'tournament/**'
      - 'teacher/**'
      - 'i18n/**'
      - 'legacy/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/build-gate.yml'
  pull_request:
    branches: [main]
    paths:
# legacy/ 也会被 copy-legacy.mjs 拷进产物，改动同样需要门禁覆盖。
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'index.html'
      - 'games/**'
      - 'how-to-play/**'
      - 'rank/**'
      - 'shop/**'
      - 'stats/**'
      - 'tournament/**'
      - 'teacher/**'
      - 'i18n/**'
      - 'legacy/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/build-gate.yml'

# 同一分支的新 push 直接取消在跑的旧构建，省 CI 配额
concurrency:
  group: build-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 版本从 package.json 的 packageManager 字段读取（四个仓库都是 pnpm@10.11.1）
      - uses: pnpm/action-setup@v4

      # engines 声明 ">=20.0.0 <23"，故固定 22
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # shared 契约漂移门禁（2026-10-22，收敛阶段4）：public/shared/ 里的跨站
      # 契约文件必须与 eyetoolkit/fe-shared 真相源逐字节一致。直接改本站契约
      # 文件会在此被拦——正确流程是 fe-shared 改 → npm run sync:shared → commit。
      # 数据源 raw.githubusercontent.com（免鉴权，脚本内 3 次退避重试）。
      - name: Shared contract sync check
        run: pnpm sync:shared:check

      # tsc --noEmit + vite build + 产物后处理，一步到位
      - name: Type check + build
        run: pnpm build

      # 10 个围棋引擎单测（node --experimental-strip-types 原生跑 .test.ts，无需 tsx）。
      # 不含 b-m2-track-chunk.test.mjs —— 它是 live 集成探针（fetch 线上 boardduel.com chunk），
      # 会因网络抖动假红，留在本地手动跑；红线 RULES-FE-G「假失败比真 bug 费时间」
      - name: Unit tests
        run: pnpm test
